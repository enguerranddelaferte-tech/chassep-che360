# Applis Android et iPhone (Capacitor) construites à partir de index.html.
# - Android : APK de test, publié dans la release « android-test » (à installer sur un téléphone Android).
# - iPhone : vérification que l'appli se compile (sans signature ; la publication demandera le compte Apple).
name: Applis mobiles

on:
  push:
    branches: [main]
    paths: ["index.html", "sw.js", "mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dépendances
        run: npm install --no-audit --no-fund
      - name: Appli web
        run: node scripts/prepare-www.mjs
      - name: Projet Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#F3F0E8' --iconBackgroundColorDark '#131B19' --splashBackgroundColor '#F3F0E8' --splashBackgroundColorDark '#131B19'
          node scripts/native-config.mjs android ${{ github.run_number }}
          npx cap sync android
      - name: Compilation
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: APK
        run: |
          mkdir -p ../out
          cp android/app/build/outputs/apk/debug/app-debug.apk "../out/ChassePeche360-test-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
      - name: Release de test
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test out/*.apk --prerelease --target "${{ github.sha }}" \
            --title "Appli Android de test (build ${{ github.run_number }})" \
            --notes "APK de test à installer sur un téléphone Android (autoriser l'installation d'applis de cette source). Construit depuis ${{ github.sha }}."

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dépendances
        run: npm install --no-audit --no-fund
      - name: Appli web
        run: node scripts/prepare-www.mjs
      - name: Projet iPhone
        run: |
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#F3F0E8' --splashBackgroundColor '#F3F0E8' --splashBackgroundColorDark '#131B19'
          node scripts/native-config.mjs ios ${{ github.run_number }}
          npx cap sync ios
      - name: Compilation (simulateur, sans signature)
        working-directory: mobile/ios/App
        run: |
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
          test ${PIPESTATUS[0]} -eq 0
